[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "eternal-studio-core"
version = "0.0.1"
description = "High-performance Rust native core engine for Eternal Studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Furkan Karabudak" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Furkan-Karabudak/eternal-studio-core"

[tool.maturin]
python-source = "python"
module-name = "eternal_studio_core._core"
features = ["pyo3/extension-module"]
strip = true
